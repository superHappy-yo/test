[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shapefuse"
version = "0.3.0"
description = "Shape-conditioned intensity classification and dual-plan operator fusion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
bench = ["torch>=2.1"]

[project.scripts]
shapefuse = "shapefuse.cli:main"

[tool.setuptools.packages.find]
include = ["shapefuse*"]
